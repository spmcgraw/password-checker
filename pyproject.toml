[project]
name = "passwordchecker"
version = "0.1.0"
description = "Password checker that accesses a Proton Pass Vault to validate it has not been hacked"
readme = "README.md"
authors = [
    { name = "Sean McGraw", email = "spmcgraw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
passwordchecker = "passwordchecker.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
